apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitbadges-explorer-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # explorer.bitbadges.io is orange-cloud; lock origin to Cloudflare IP ranges.
    # Source: https://www.cloudflare.com/ips/ — rotate annotation when CF updates.
    nginx.ingress.kubernetes.io/whitelist-source-range: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
spec:
  tls:
    - hosts:
        - explorer.bitbadges.io
      secretName: bitbadges-cert
  rules:
    - host: explorer.bitbadges.io
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: bitbadges-explorer
                port:
                  number: 80
    - host: explorer.bitbadges.io
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: bitbadges-explorer
                port:
                  number: 443
  ingressClassName: nginx
