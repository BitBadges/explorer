apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitbadges-explorer
  labels:
    app: bitbadges-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitbadges-explorer
  template:
    metadata:
      labels:
        app: bitbadges-explorer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bitbadges-explorer
          image: trevormil23/bitbadges-explorer:3.0.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: bitbadges-explorer-config
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
