
name: Config Checker

on:
  # push:
  #   branches: [ master ]
  pull_request:
   # branches: [ master ]
   paths:
      - 'chains/mainnet/**'
      - 'chains/testnet/**'

jobs:
  deploy:
    name: Check Blockchain Config
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","mbp2"]') || 'ubuntu-latest' }}
    steps:
    - name: Git Checkout Latest
      uses: actions/checkout@v3
    - name: Check Chain Configs
      uses: ping-pub/ping-dashboard-config-checker@v1.0